[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "retroperfect"
version = "0.1.0"
description = "Curate retro ROM collections with DAT metadata and RetroAchievements-aware profiles."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "nicegui>=2.0.0",
  "platformdirs>=4.2.0",
  "pydantic>=2.7.0",
  "pyyaml>=6.0.1",
  "requests>=2.31.0",
  "rich>=13.7.0",
  "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
]

[project.scripts]
retroperfect = "retroperfect.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/retroperfect"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

