name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: RetroPerfect-linux
          - os: macos-latest
            asset: RetroPerfect-macos
          - os: windows-latest
            asset: RetroPerfect-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e . pyinstaller
      - name: Package (onedir)
        run: nicegui-pack --onedir --name RetroPerfect scripts/retroperfect_app.py
      - name: Zip
        run: python -c "import shutil; shutil.make_archive('${{ matrix.asset }}', 'zip', 'dist', 'RetroPerfect')"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
          generate_release_notes: true
