name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Publica en PyPI vía Trusted Publishing (OIDC): sin tokens ni secretos.
  # Requiere registrar el publicador en pypi.org (repo ruvelro/RetroPerfect,
  # workflow release.yml, environment pypi) y crear el environment en GitHub.
  pypi:
    # Publicar en PyPI es irreversible (una versión no se puede resubir), así
    # que espera a que los binarios compilen: si algo falla, se corrige y se
    # re-etiqueta sin haber quemado el número de versión.
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/retroperfect
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Comprobar que el tag coincide con la versión del paquete
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$tag" != "$version" ]; then
            echo "El tag v$tag no coincide con la versión $version de pyproject.toml" >&2
            exit 1
          fi
      - name: Construir sdist y wheel
        run: |
          pip install build
          python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 a propósito: PyInstaller no empaqueta glibc, así que el binario
          # exige la del runner. Compilar en 24.04 pedía glibc 2.38 y rompía en
          # Ubuntu 22.04 LTS, Debian 12 y derivadas.
          - os: ubuntu-22.04
            asset: RetroPerfect-linux
          - os: macos-latest
            asset: RetroPerfect-macos
          - os: windows-latest
            asset: RetroPerfect-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e . pyinstaller
      - name: Empaquetar .app y comprimir (macOS)
        if: runner.os == 'macOS'
        run: |
          nicegui-pack --onedir --windowed --name RetroPerfect scripts/retroperfect_app.py
          mkdir -p dist/RetroPerfect-macos
          mv dist/RetroPerfect.app dist/RetroPerfect-macos/
          cp packaging/LEEME-macOS.txt dist/RetroPerfect-macos/
          # ditto, no zip: preserva symlinks, permisos y la firma ad-hoc del bundle.
          ditto -c -k --sequesterRsrc --keepParent dist/RetroPerfect-macos ${{ matrix.asset }}.zip
      - name: Empaquetar y comprimir (Windows y Linux)
        if: runner.os != 'macOS'
        run: |
          nicegui-pack --onedir --name RetroPerfect scripts/retroperfect_app.py
          python -c "import shutil; shutil.make_archive('${{ matrix.asset }}', 'zip', 'dist', 'RetroPerfect')"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
          generate_release_notes: true
