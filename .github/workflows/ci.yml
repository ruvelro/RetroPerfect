name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Mypy
        run: mypy
      # La puerta está por debajo de la cobertura real a propósito: es una red
      # contra retrocesos, no un número que haya que perseguir en cada PR.
      - name: Tests
        run: pytest -q --cov=retroperfect --cov-report=term-missing --cov-fail-under=80
